<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>{% block title %}Machine Hub{% endblock %}</title>

  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/user.css">
  <link rel="stylesheet" href="/static/css/mh-user.css">

  <script>
    (function() {
      try {
        var t = localStorage.getItem('mh_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

{% block content %}{% endblock %}

<!-- Icons sprite -->
<script src="/static/js/icons.js"></script>
<script src="/static/js/theme.js"></script>

<!-- SheetJS (Excel) -->
<script src="/static/vendor/xlsx.full.min.js"></script>
<!-- QR -->
<script src="/static/vendor/qrcode.min.js"></script>

<!-- App logic -->
<script src="/static/js/db.js"></script>
<script src="/static/js/excel.js"></script>
<script src="/static/js/search.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/machine.js"></script>
<script src="/static/js/modal.js"></script>

{% block extra_scripts %}{% endblock %}

</body>
</html>
